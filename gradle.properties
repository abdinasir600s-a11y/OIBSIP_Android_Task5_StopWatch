# Project-wide Gradle properties
# https://docs.gradle.org/current/userguide/build_environment.html

# Enable AndroidX (required for appcompat and material libraries)
android.useAndroidX=true

# Disable the Jetifier (we don't use any legacy Support Library artifacts)
android.enableJetifier=false

# Increase the JVM heap size for faster builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle daemon for faster subsequent builds
org.gradle.daemon=true

# Enable parallel project execution
org.gradle.parallel=true

# Suppress non-critical build warnings
android.suppressUnsupportedCompileSdk=36
android.javaCompile.suppressSourceTargetDeprecationWarning=true
